<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Cinema</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
            padding-top: 50px; 
            margin: 0;
        }
        h1 { font-size: 30px; color: #0084ff; }
        .grade { display: block; max-width: 500px; margin: 0 auto; padding: 0 20px; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 30px; 
            margin: 20px 0; 
            background: #1e1e1e; 
            color: white; 
            border-radius: 15px; 
            font-size: 24px; 
            font-weight: bold;
            border: 4px solid #444; 
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn:hover, .btn:focus { 
            border-color: #0084ff; 
            background: #0056b3; 
        }

        #containerVideo {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }
        img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="conteudoPrincipal">
        <h1>🍿 Teste de Botão do Cinema</h1>
        <p style="font-size: 18px;">Clique no botão abaixo para testar o comando da TV</p>
        
        <div class="grade">
            <button class="btn" onclick="iniciarFilme('https://files.catbox.moe/qq4y6i.jpeg')">
                🎬 Testar Player na TV
            </button>
        </div>
    </div>

    <div id="containerVideo">
        <img id="imagemTeste" src="" alt="Tela de Teste">
    </div>

    <script>
        function iniciarFilme(url) {
            var container = document.getElementById('containerVideo');
            var img = document.getElementById('imagemTeste');
            
            container.style.display = 'block';
            img.src = url;

            // Se apertar o botão 'Back' (Voltar) no controle da TV LG, fecha o teste
            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 461 || e.key === 'Escape') {
                    container.style.display = 'none';
                    img.src = '';
                }
            });
        }
    </script>
</body>
</html>
