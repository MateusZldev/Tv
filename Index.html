<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cinema</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
            padding-top: 50px; 
            margin: 0;
        }
        h1 { font-size: 30px; color: #0084ff; }
        .grade { display: block; max-width: 500px; margin: 0 auto; padding: 0 20px; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 25px; 
            margin: 15px 0; 
            background: #1e1e1e; 
            color: white; 
            border-radius: 15px; 
            font-size: 22px; 
            font-weight: bold;
            border: 4px solid #444; 
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn:hover, .btn:focus { 
            border-color: #0084ff; 
            background: #0056b3; 
        }

        #containerVideo {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="conteudoPrincipal">
        <h1>🍿 Meu Cinema Particular</h1>
        <p style="font-size: 18px;">Escolha o que assistir no controle remoto</p>
        
        <div class="grade">
            <button class="btn" onclick="iniciarFilme('https://archive.org/download/filme-anaconda-25/Filme-anaconda25.mp4')">
                🎬 Assistir Filme Anaconda
            </button>

            <button class="btn" onclick="iniciarFilme('https://edge1-waw-sprintcdn.r66nv9ed.com/hls2/08/09725/hlgpo5mldle1_h/master.m3u8?t=2b9qbunJZ3OyauNnLWNQYC0nyeDmLkevbHKiLpCvWfw&s=1782793318&e=10800&f=53515443&srv=1075&asn=&sp=4000&p=0')">
                🧪 Rick and Morty (Episódio)
            </button>
        </div>
    </div>

    <div id="containerVideo">
        <video id="playerFilme" controls autoplay></video>
    </div>

    <script>
        var hls = null;

        function iniciarFilme(url) {
            var container = document.getElementById('containerVideo');
            var video = document.getElementById('playerFilme');
            
            container.style.display = 'block';

            // Se for um link de streaming .m3u8
            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (hls) { hls.destroy(); }
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                }
            } else {
                // Se for um arquivo normal .mp4
                if (hls) { hls.destroy(); hls = null; }
                video.src = url;
                video.play();
            }

            // Botão 'Back' (Voltar) do controle da TV LG fecha o player
            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 461 || e.key === 'Escape') {
                    video.pause();
                    video.src = '';
                    if (hls) { hls.destroy(); hls = null; }
                    container.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
