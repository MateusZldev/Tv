<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cinema</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --netflix-red: #E50914; --bg-black: #141414; --card-bg: #181818; }
        body { background-color: var(--bg-black); color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        .navbar { padding: 20px 40px; position: fixed; top: 0; width: 100%; z-index: 10; background: rgba(0,0,0,0.8); }
        .logo { color: var(--netflix-red); font-size: 28px; font-weight: bold; }
        .content-container { padding: 100px 40px 40px 40px; }
        .section-title { font-size: 24px; margin: 30px 0; font-weight: bold; }
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .ep-card { background: var(--card-bg); border-radius: 8px; cursor: pointer; border: 3px solid transparent; }
        .ep-card:hover { transform: scale(1.05); border-color: #fff; }
        .ep-thumb { width: 100%; height: 160px; background: #333; position: relative; display: flex; align-items: center; justify-content: center; }
        .ep-info { padding: 15px; }
        #containerVideo { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="navbar"><div class="logo">NETFLIX</div></div>

    <div class="content-container">
        <div class="section-title">🧬 Rick and Morty (Dublado PT-BR)</div>
        <div class="episodes-grid">
            
            <!-- Temporadas Dubladas via Servidor Externo -->
            <div class="ep-card" onclick="prepararFilme('https://stream.voidboost.cc/0a1a0170566373809618173468501254/play.m3u8')">
                <div class="ep-thumb">▶ Temporada 1 (Dublado)</div>
                <div class="ep-info">Temporada Completa</div>
            </div>

            <div class="ep-card" onclick="prepararFilme('https://stream.voidboost.cc/75412496159514782356515486214589/play.m3u8')">
                <div class="ep-thumb">▶ Temporada 2 (Dublado)</div>
                <div class="ep-info">Temporada Completa</div>
            </div>

            <div class="ep-card" onclick="prepararFilme('https://stream.voidboost.cc/54896231458796541236547896541258/play.m3u8')">
                <div class="ep-thumb">▶ Temporada 3 (Dublado)</div>
                <div class="ep-info">Temporada Completa</div>
            </div>

        </div>
    </div>

    <div id="containerVideo">
        <video id="playerFilme" controls autoplay></video>
    </div>

    <script>
        var hls = null;
        function prepararFilme(url) {
            var container = document.getElementById('containerVideo');
            var video = document.getElementById('playerFilme');
            container.style.display = 'block';
            history.pushState({player: "ativo"}, "");

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.play();
            } else {
                video.src = url;
                video.play();
            }
        }

        window.addEventListener('popstate', function() {
            document.getElementById('containerVideo').style.display = 'none';
            if (hls) hls.destroy();
            document.getElementById('playerFilme').pause();
        });
    </script>
</body>
</html>
