<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cinema</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-black: #141414;
            --card-bg: #181818;
        }
        body { 
            background-color: var(--bg-black); 
            color: #fff; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .navbar {
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            position: fixed;
            top: 0; width: 100%; z-index: 10;
            box-sizing: border-box;
        }
        .logo {
            color: var(--netflix-red);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .content-container { padding: 120px 40px 40px 40px; }
        .section-title { font-size: 24px; color: #fff; margin-bottom: 20px; font-weight: bold;}

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
        }
        .card {
            background: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer;
            transition: transform 0.2s ease; border: 3px solid transparent; box-sizing: border-box;
        }
        .card:hover { transform: scale(1.05); border-color: #fff; }
        .thumb { height: 160px; background: #222 center center no-repeat; background-size: cover; position: relative; display: flex; align-items: center; justify-content: center;}
        .play-btn { font-size: 40px; color: white; background: rgba(0,0,0,0.5); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .info { padding: 15px; }
        .title { font-size: 16px; margin: 0; font-weight: bold; }

        /* Container do Player em Tela Cheia */
        #playerModal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: #000; 
            z-index: 9999; 
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="navbar"><div class="logo">NETFLIX</div></div>

    <div class="content-container">
        <div class="section-title">🎬 Catálogo Atualizado (Embed Player)</div>
        <div class="grid">
            
            <!-- Anaconda 25 (Hospedado no Drive - Puxando o Stream Direto) -->
            <div class="card" onclick="abrirPlayer('https://archive.org/video/embed.php?id=filme-anaconda-25')">
                <div class="thumb" style="background-image: url('https://files.catbox.moe/qq4y6i.jpeg')">
                    <div class="play-btn">▶</div>
                </div>
                <div class="info"><p class="title">Anaconda 25</p></div>
            </div>

            <!-- Transformers Clássico Dublado -->
            <div class="card" onclick="abrirPlayer('https://archive.org/video/embed.php?id=transformers-the-movie-1986-dublado')">
                <div class="thumb" style="background-image: url('https://images.alphacoders.com/605/605655.jpg')">
                    <div class="play-btn">▶</div>
                </div>
                <div class="info"><p class="title">Transformers: O Filme (1986)</p></div>
            </div>

            <!-- Rick and Morty - Temporada 1 Completa -->
            <div class="card" onclick="abrirPlayer('https://archive.org/video/embed.php?id=rick-and-morty-season-1_202209')">
                <div class="thumb" style="background-image: url('https://images6.alphacoders.com/911/911656.jpg')">
                    <div class="play-icon"><div class="play-btn">▶</div></div>
                </div>
                <div class="info"><p class="title">Rick and Morty (S01 - Inglês)</p></div>
            </div>

        </div>
    </div>

    <!-- Janela de reprodução segura -->
    <div id="playerModal">
        <iframe id="cinemaFrame" src="" allowfullscreen allow="autoplay"></iframe>
    </div>

    <script>
        let videoAberto = false;

        function abrirPlayer(urlEmbed) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('cinemaFrame');
            
            iframe.src = urlEmbed;
            modal.style.display = 'block';
            videoAberto = true;

            // Histórico para celulares não fecharem o site ao voltar
            history.pushState({player: "ativo"}, "");
        }

        // Fecha o player se apertar Voltar na TV (461) ou ESC (27)
        window.addEventListener('keydown', function(e) {
            if (videoAberto && (e.keyCode === 461 || e.keyCode === 27)) {
                e.preventDefault();
                history.back();
            }
        });

        // Evento que escuta o botão voltar do celular e da TV sincronizados
        window.addEventListener('popstate', function() {
            if (videoAberto) {
                const modal = document.getElementById('playerModal');
                const iframe = document.getElementById('cinemaFrame');
                
                iframe.src = ""; // Corta o carregamento do player imediatamente
                modal.style.display = 'none';
                videoAberto = false;
            }
        });
    </script>
</body>
</html>
