<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cinema</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
            padding-top: 50px; 
        }
        h1 { font-size: 30px; color: #0084ff; }
        .grade { display: block; max-width: 500px; margin: 0 auto; }
        
        /* Botão super largo e alto para facilitar o clique com a setinha da TV */
        .btn { 
            display: block; 
            width: 100%; 
            padding: 30px; 
            margin: 20px 0; 
            background: #1e1e1e; 
            color: white; 
            text-decoration: none; 
            border-radius: 15px; 
            font-size: 24px; 
            font-weight: bold;
            border: 4px solid #444; 
            cursor: pointer;
        }
        /* Quando a setinha do controle passar por cima ou focar */
        .btn:hover, .btn:focus { 
            border-color: #0084ff; 
            background: #0056b3; 
        }
    </style>
</head>
<body>

    <h1>🍿 Selecione o Filme com a Setinha</h1>
    <p style="font-size: 18px;">Leve a setinha até o botão e aperte o botão do meio (OK/Enter)</p>
    
    <div class="grade">
        <a href="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" 
           class="btn" 
           onclick="window.location.href=this.href; return false;">
           🎬 Testar Filme (MP4)
        </a>
    </div>

</body>
</html>
