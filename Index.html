<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Cinema</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .btn { display: block; width: 80%; max-width: 400px; margin: 20px auto; padding: 30px; background: #222; color: white; border-radius: 15px; font-size: 24px; font-weight: bold; border: 3px solid #444; cursor: pointer; }
        #containerVideo { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <button class="btn" onclick="iniciarFilme('https://m9.stb.services/cptv/index.m3u8')">
        📺 Assistir TV Ao Vivo
    </button>

    <div id="containerVideo"><video id="playerFilme" controls></video></div>

    <script>
        function iniciarFilme(url) {
            var container = document.getElementById('containerVideo');
            var video = document.getElementById('playerFilme');
            container.style.display = 'block';

            // Configuração para deixar o carregamento mais leve para TVs
            var config = {
                maxBufferLength: 10,
                maxMaxBufferLength: 10,
                lowLatencyMode: true
            };

            var hls = new Hls(config);
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });

            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 461) { // Botão 'Back' da LG
                    video.pause();
                    container.style.display = 'none';
                    hls.destroy(); // Limpa a memória da TV
                }
            });
        }
    </script>
</body>
</html>
