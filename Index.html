<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cinema e IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 20px;
        }
        h1 { font-size: 28px; color: #0084ff; margin-bottom: 5px; }
        h2 { font-size: 20px; color: #aaa; margin-top: 20px; }
        
        .grade { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 15px; 
            max-width: 1000px; 
            margin: 20px auto; 
            padding: 0 10px; 
        }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 20px; 
            background: #1e1e1e; 
            color: white; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold;
            border: 3px solid #444; 
            cursor: pointer;
            box-sizing: border-box;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
        .btn:hover, .btn:focus { 
            border-color: #0084ff; 
            background: #0056b3; 
            outline: none;
        }

        #containerVideo {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; }
        
        #listaCanais {
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #333;
            background: #151515;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="conteudoPrincipal">
        <h1>🍿 Meu Centro de Mídia</h1>
        <p>Use o controle remoto para selecionar</p>
        
        <h2>🎬 Filmes</h2>
        <div class="grade">
            <button class="btn" onclick="iniciarVideo('https://archive.org/download/filme-anaconda-25/Filme-anaconda25.mp4')">
                Anaconda
            </button>
        </div>

        <h2>📺 Canais de TV (IPTV Live)</h2>
        <div class="grade" id="listaCanais">
            <p id="carregando" style="grid-column: 1/-1; padding: 20px;">Carregando lista de canais...</p>
        </div>
    </div>

    <div id="containerVideo">
        <video id="playerFilme" controls autoplay></video>
    </div>

    <script>
        var hls = null;

        // Função para carregar e processar a lista .m3u
        async function carregarIPTV() {
            const urlM3U = 'https://iptv-org.github.io/iptv/index.m3u';
            const containerCanais = document.getElementById('listaCanais');
            
            try {
                const resposta = await fetch(urlM3U);
                const texto = await resposta.text();
                
                // Limpa o aviso de carregando
                containerCanais.innerHTML = '';
                
                const linhas = texto.split('\n');
                let nomeCanal = '';
                
                // Vasculha o arquivo procurando os canais e os links
                for (let i = 0; i < linhas.length; i++) {
                    let linha = linhas[i].trim();
                    
                    if (linha.startsWith('#EXTINF:')) {
                        // Pega o nome do canal que fica depois da vírgula
                        const partes = linha.split(',');
                        nomeCanal = partes[partes.length - 1] || 'Canal Sem Nome';
                    } else if (linha.startsWith('http')) {
                        // Encontrou o link do canal, cria o botão na tela
                        const urlCanal = linha;
                        
                        const botao = document.createElement('button');
                        botao.className = 'btn';
                        botao.innerText = '📺 ' + nomeCanal;
                        botao.onclick = function() { iniciarVideo(urlCanal); };
                        
                        containerCanais.appendChild(botao);
                    }
                }
            } catch (erro) {
                containerCanais.innerHTML = '<p style="grid-column: 1/-1; color: red;">Erro ao carregar os canais.</p>';
                console.error(erro);
            }
        }

        function iniciarVideo(url) {
            var container = document.getElementById('containerVideo');
            var video = document.getElementById('playerFilme');
            
            container.style.display = 'block';

            // Canais ao vivo geralmente usam formatos de transmissão (.m3u8 ou streams sem extensão)
            if (url.includes('.m3u8') || url.includes('master') || !url.includes('.mp4')) {
                if (Hls.isSupported()) {
                    if (hls) { hls.destroy(); }
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                }
            } else {
                if (hls) { hls.destroy(); hls = null; }
                video.src = url;
                video.play();
            }

            // Botão 'Back' (Voltar) do controle remoto fecha o player
            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 461 || e.key === 'Escape') {
                    video.pause();
                    video.src = '';
                    if (hls) { hls.destroy(); hls = null; }
                    container.style.display = 'none';
                }
            });
        }

        // Inicializa a lista de canais assim que a página abre
        carregarIPTV();
    </script>
</body>
</html>
