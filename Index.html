<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cinema</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
            padding-top: 50px; 
            margin: 0;
        }
        h1 { font-size: 30px; color: #0084ff; }
        .grade { display: block; max-width: 500px; margin: 0 auto; padding: 0 20px; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 30px; 
            margin: 20px 0; 
            background: #1e1e1e; 
            color: white; 
            border-radius: 15px; 
            font-size: 24px; 
            font-weight: bold;
            border: 4px solid #444; 
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn:hover, .btn:focus { 
            border-color: #0084ff; 
            background: #0056b3; 
        }

        #containerVideo {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="conteudoPrincipal">
        <h1>🍿 Selecione o Filme com a Setinha</h1>
        <p style="font-size: 18px;">Leve a setinha até o botão e aperte o OK do controle</p>
        
        <div class="grade">
            <button class="btn" onclick="iniciarFilme('https://m9.stb.services/cptv/index.m3u8')">
                📺 Assistir TV Ao Vivo
            </button>
        </div>
    </div>

    <div id="containerVideo">
        <video id="playerFilme" controls autoplay></video>
    </div>

    <script>
        function iniciarFilme(url) {
            var container = document.getElementById('containerVideo');
            var video = document.getElementById('playerFilme');
            
            container.style.display = 'block';

            // Verifica se a TV precisa da biblioteca corretora para rodar o vídeo
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } 
            // Se a TV já tiver suporte nativo, roda direto
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }

            // Botão 'Back' (Voltar) ou 'Exit' do controle da TV fecha o player
            window.addEventListener('keydown', function(e) {
                if (e.keyCode === 461 || e.key === 'Escape') {
                    video.pause();
                    video.src = '';
                    container.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
